aid: douxmatok
name: DouxMatok
description: 'DouxMatok is an Israeli food-technology company, rebranded as Incredo
  Ltd in May 2023, that develops Incredo Sugar — a sugar-based sugar-reduction ingredient
  built on a patented silica-carrier delivery technology that improves how efficiently
  real cane or beet sugar reaches sweet taste receptors, enabling manufacturers to
  cut sugar in bakery, confectionery, chocolate, spreads and nut butters by 30-50%
  (the company markets up to 70%) without artificial sweeteners, sugar alcohols or
  the aftertaste and cooling effects of alternative sweeteners. The technology is
  protected by more than 20 patents, was named a TIME Best Invention of 2020, and
  was featured in Netflix''s "Explained". The company sells as a B2B ingredient to
  food manufacturers through distributors and partner enquiries, and is backed by
  Sienna Venture Capital, Pitango, DSM-Firmenich Venturing and BlueRed Partners. It
  is an ingredient manufacturer, not a software vendor: as of this profile it operates
  a twelve-page marketing website and publishes no API, SDK, developer portal or
  machine-readable specification of any kind.'
